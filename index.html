<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WHO|idle</title>
<style>body{font:12px sans-serif;color:#ddd;background:#111}</style>
</head>
<body>
<script>
(function () {
  "use strict";

  var API = "https://api.deadlock-api.com/v1/players/";
  var MATCH_API = "https://api.deadlock-api.com/v1/matches/";
  var ASSETS = "https://api.deadlock-api.com/v1/assets/heroes";
  var MODES = ["normal", "street_brawl"];
  var STATS_TTL = 2 * 60 * 1000;
  var HERO_TTL = 24 * 60 * 60 * 1000;
  var META_TTL = 7 * 24 * 60 * 60 * 1000;
  var SESSION_TTL = 10 * 60 * 1000;
  var STATS_PREFIX = "who_stats_v3_";
  var META_PREFIX = "who_meta_v1_";
  var SESSION_KEY = "who_session_roster_v1";
  var HERO_KEY = "who_heroes_v1";
  var ROSTER_PREFIX = "who_rosters_v2_";
  var ROSTER_TTL = 24 * 60 * 60 * 1000;
  var ROSTER_MAX = 15;

  var statsCache = null;
  var statsMe = "";
  var busy = false;
  var pending = false;

  function title(s) {
    try { document.title = "WHO|" + s; } catch (e) { }
  }

  function parseHash() {
    try {
      var h = location.hash ? location.hash.slice(1) : "";
      if (!h) return null;
      return JSON.parse(decodeURIComponent(h));
    } catch (e) {
      return null;
    }
  }

  function readJson(key, ttl) {
    try {
      var raw = localStorage.getItem(key);
      if (!raw) return null;
      var obj = JSON.parse(raw);
      if (!obj || typeof obj.at !== "number" || Date.now() - obj.at > ttl) return null;
      return obj.data;
    } catch (e) {
      return null;
    }
  }

  function writeJson(key, data) {
    try { localStorage.setItem(key, JSON.stringify({ at: Date.now(), data: data })); } catch (e) { }
  }

  function loadRosters(me) {
    return readJson(ROSTER_PREFIX + me, ROSTER_TTL) || [];
  }

  function saveRosters(me, list) {
    writeJson(ROSTER_PREFIX + me, list.slice(-ROSTER_MAX));
  }

  function sameSet(a, b) {
    if (!a || !b || a.length !== b.length) return false;
    var sa = a.slice().sort();
    var sb = b.slice().sort();
    for (var i = 0; i < sa.length; i++) {
      if (sa[i] !== sb[i]) return false;
    }
    return true;
  }

  function isSubset(a, b) {
    if (!a || !b) return false;
    for (var i = 0; i < a.length; i++) {
      if (b.indexOf(a[i]) < 0) return false;
    }
    return true;
  }

  function uniqueIds(players) {
    var seen = {};
    var out = [];
    var list = players || [];
    for (var i = 0; i < list.length; i++) {
      var id = String((list[i] && list[i].id) || "");
      if (!id || seen[id]) continue;
      seen[id] = true;
      out.push(id);
    }
    return out;
  }

  function fetchJson(url) {
    return fetch(url, { cache: "no-store" }).then(function (r) {
      if (!r.ok) throw new Error("http " + r.status);
      return r.json();
    });
  }

  function withTimeout(promise, ms, fallback) {
    return Promise.race([
      promise,
      new Promise(function (resolve) {
        setTimeout(function () { resolve(fallback); }, ms);
      })
    ]);
  }

  function loadStats(me, force) {
    if (!force && statsCache && statsMe === me) return Promise.resolve(statsCache);
    if (!force) {
      var cached = readJson(STATS_PREFIX + me, STATS_TTL);
      if (cached) {
        statsCache = cached;
        statsMe = me;
        return Promise.resolve(cached);
      }
    }
    var urls = [];
    for (var i = 0; i < MODES.length; i++) {
      urls.push(API + me + "/mate-stats?game_mode=" + MODES[i]);
      urls.push(API + me + "/enemy-stats?game_mode=" + MODES[i]);
    }
    return Promise.all(urls.map(fetchJson)).then(function (res) {
      var mates = {};
      var enemies = {};
      for (var k = 0; k < MODES.length; k++) {
        var mres = res[k * 2] || [];
        var eres = res[k * 2 + 1] || [];
        for (var a = 0; a < mres.length; a++) {
          var id = String(mres[a].mate_id);
          if (!mates[id]) mates[id] = { m: 0, w: 0, matches: [] };
          mates[id].m += mres[a].matches_played || 0;
          mates[id].w += mres[a].wins || 0;
          var mm = mres[a].matches || [];
          for (var mi = 0; mi < mm.length; mi++) mates[id].matches.push(String(mm[mi]));
        }
        for (var b = 0; b < eres.length; b++) {
          var eid = String(eres[b].enemy_id);
          if (!enemies[eid]) enemies[eid] = { e: 0, w: 0, matches: [] };
          enemies[eid].e += eres[b].matches_played || 0;
          enemies[eid].w += eres[b].wins || 0;
          var em = eres[b].matches || [];
          for (var ei = 0; ei < em.length; ei++) enemies[eid].matches.push(String(em[ei]));
        }
      }
      var data = { mates: mates, enemies: enemies };
      writeJson(STATS_PREFIX + me, data);
      statsCache = data;
      statsMe = me;
      return data;
    });
  }

  function loadHeroes() {
    var cached = readJson(HERO_KEY, HERO_TTL);
    if (cached) return Promise.resolve(cached);
    return fetchJson(ASSETS).then(function (list) {
      var map = {};
      for (var i = 0; i < list.length; i++) {
        map[String(list[i].id)] = String(list[i].name || "");
      }
      writeJson(HERO_KEY, map);
      return map;
    });
  }

  function loadMetadata(ids) {
    var out = {};
    var missing = [];
    for (var i = 0; i < ids.length; i++) {
      var id = String(ids[i]);
      var cached = readJson(META_PREFIX + id, META_TTL);
      if (cached) out[id] = cached;
      else missing.push(id);
    }
    if (!missing.length) return Promise.resolve(out);
    var url = MATCH_API + "metadata?match_ids=" + missing.join(",") + "&include_player_kda=true";
    return fetchJson(url).then(function (list) {
      for (var j = 0; j < list.length; j++) {
        var m = list[j];
        var mid = String(m.match_id);
        out[mid] = m;
        writeJson(META_PREFIX + mid, m);
      }
      return out;
    });
  }

  function metaMode(m) {
    if (!m) return "";
    var gm = String(m.game_mode || "");
    var mm = String(m.match_mode || "");
    if (gm === "Street Brawl") return "Street Brawl";
    if (mm === "Ranked") return "Ranked";
    if (mm === "Unranked") return "Normal";
    if (gm === "Normal") return "Normal";
    return mm || gm || "";
  }

  function metaTime(m) {
    if (!m) return 0;
    var v = m.start_time;
    if (typeof v === "number") return v;
    var s = String(v || "");
    if (!s) return 0;
    var parsed = Date.parse(s.indexOf("T") >= 0 ? s : s.replace(" ", "T") + "Z");
    return isNaN(parsed) ? 0 : Math.floor(parsed / 1000);
  }

  function playerIn(m, acc) {
    var list = (m && m.players) || [];
    var target = String(acc || "");
    for (var i = 0; i < list.length; i++) {
      if (String(list[i].account_id) === target) return list[i];
    }
    return null;
  }

  function metaEntry(m, me, id, heroes) {
    if (!m) return null;
    var mine = playerIn(m, me);
    var mate = playerIn(m, id);
    if (!mate) return null;
    var side = mine && mine.team === mate.team ? "with" : "vs";
    var win = -1;
    if (mine && m.winning_team) win = mine.team === m.winning_team ? 1 : 0;
    return {
      mid: String(m.match_id),
      hero: heroes[String(mate.hero_id)] || "",
      time: metaTime(m),
      mode: metaMode(m),
      side: side,
      k: Number(mate.kills),
      d: Number(mate.deaths),
      a: Number(mate.assists),
      yk: mine ? Number(mine.kills) : -1,
      yd: mine ? Number(mine.deaths) : -1,
      ya: mine ? Number(mine.assists) : -1,
      win: win
    };
  }

  function profile(me, id) {
    return Promise.all([
      loadStats(me),
      withTimeout(loadHeroes().catch(function () { return {}; }), 5000, {})
    ]).then(function (all) {
      var stats = all[0];
      var heroes = all[1];
      var m = stats.mates[id];
      var e = stats.enemies[id];
      var shared = {};
      var i;
      if (m && m.matches) {
        for (i = 0; i < m.matches.length; i++) shared[m.matches[i]] = "with";
      }
      if (e && e.matches) {
        for (i = 0; i < e.matches.length; i++) {
          if (!shared[e.matches[i]]) shared[e.matches[i]] = "vs";
        }
      }
      var ids = Object.keys(shared);
      ids.sort(function (a, b) { return Number(b) - Number(a); });
      var pick = ids.slice(0, 5);
      return withTimeout(loadMetadata(pick).catch(function () { return {}; }), 8000, {}).then(function (meta) {
        var out = [];
        for (i = 0; i < pick.length && out.length < 3; i++) {
          var entry = metaEntry(meta[pick[i]], me, id, heroes);
          if (entry) out.push(entry);
        }
        var rosters = loadRosters(me);
        var prev = rosters.slice(0, -1);
        var local = 0;
        for (var r = 0; r < prev.length; r++) {
          if (prev[r].ids && prev[r].ids.indexOf(String(id)) >= 0) local += 1;
        }
        return {
          m: m ? m.m : 0,
          e: e ? e.e : 0,
          mw: m ? m.w : 0,
          ew: e ? e.w : 0,
          local: local,
          list: out
        };
      });
    });
  }

  function bestShared(stats, id) {
    var m = stats.mates[id];
    var e = stats.enemies[id];
    var best = 0;
    var side = "";
    function consider(list, kind) {
      if (!list) return;
      for (var i = 0; i < list.length; i++) {
        var mid = Number(list[i]) || 0;
        if (mid > best) {
          best = mid;
          side = kind;
        }
      }
    }
    consider(m && m.matches, "with");
    consider(e && e.matches, "vs");
    if (!best) return null;
    return { mid: String(best), side: side };
  }

  function readSession(me, ids) {
    var cached = readJson(SESSION_KEY, SESSION_TTL);
    if (!cached || String(cached.me || "") !== String(me)) return null;
    if (!cached.ids || !cached.list) return null;
    var allowed = {};
    for (var i = 0; i < cached.ids.length; i++) allowed[String(cached.ids[i])] = true;
    for (var j = 0; j < ids.length; j++) {
      if (!allowed[String(ids[j])]) return null;
    }
    var want = {};
    for (var k = 0; k < ids.length; k++) want[String(ids[k])] = true;
    var out = [];
    for (var n = 0; n < cached.list.length; n++) {
      var entry = cached.list[n];
      if (entry && want[String(entry.id)]) out.push(entry);
    }
    return out;
  }

  function saveSession(me, ids, list) {
    writeJson(SESSION_KEY, { me: String(me), ids: ids, list: list });
  }

  function roster(me, players, fresh) {
    var rosterIds = uniqueIds(players);
    var session = readSession(me, rosterIds);
    if (session) return Promise.resolve(session);
    loadHeroes().catch(function () { });
    return loadStats(me, !!fresh).then(function (stats) {
      var out = [];
      var byId = {};
      var list = players || [];
      for (var i = 0; i < list.length; i++) {
        var p = list[i] || {};
        var id = String(p.id || "");
        if (!id || id === String(me)) continue;
        var m = stats.mates[id];
        var e = stats.enemies[id];
        if (!m && !e) continue;
        var entry = {
          id: id,
          n: String(p.n || ""),
          m: m ? m.m : 0,
          mw: m ? m.w : 0,
          e: e ? e.e : 0,
          ew: e ? e.w : 0
        };
        out.push(entry);
        byId[id] = entry;
      }

      var ids = uniqueIds(players);
      if (ids.length >= 8) {
        var rosters = loadRosters(me);
        var last = rosters.length ? rosters[rosters.length - 1] : null;
        var now = Date.now();
        var same = last && sameSet(ids, last.ids);
        var sub = last && isSubset(ids, last.ids);
        var sup = last && isSubset(last.ids, ids);
        var sameMatch = !!(last && (same || sub || (sup && now - last.at < 3 * 60 * 1000)));
        var prev = sameMatch ? rosters.slice(0, -1) : rosters.slice();
        var counts = {};
        for (var r = 0; r < prev.length; r++) {
          var rids = prev[r].ids || [];
          for (var j = 0; j < rids.length; j++) {
            var rid = String(rids[j]);
            if (rid === String(me)) continue;
            if (ids.indexOf(rid) >= 0) counts[rid] = (counts[rid] || 0) + 1;
          }
        }
        for (var cid in counts) {
          var cnt = counts[cid];
          if (byId[cid]) {
            byId[cid].recent = true;
            byId[cid].recentCount = cnt;
          } else {
            var pname = "";
            for (var k = 0; k < list.length; k++) {
              if (String((list[k] && list[k].id) || "") === cid) pname = String(list[k].n || "");
            }
            out.push({
              id: cid,
              n: pname,
              m: cnt,
              mw: -1,
              e: 0,
              ew: 0,
              recent: true,
              recentCount: cnt
            });
          }
        }
        if (sameMatch) {
          for (var u = 0; u < ids.length; u++) {
            if (last.ids.indexOf(ids[u]) < 0) last.ids.push(ids[u]);
          }
          last.at = now;
        } else {
          rosters.push({ at: now, ids: ids });
        }
        saveRosters(me, rosters);
      }

      out.sort(function (x, y) { return (y.m + y.e) - (x.m + x.e); });

      var top = out.slice(0, 6);
      if (!top.length) {
        saveSession(me, ids, out);
        return out;
      }

      var wanted = [];
      var bestById = {};
      for (var t = 0; t < top.length; t++) {
        var best = bestShared(stats, top[t].id);
        if (!best) continue;
        bestById[top[t].id] = best;
        if (wanted.indexOf(best.mid) < 0) wanted.push(best.mid);
      }

      return Promise.all([
        withTimeout(loadHeroes().catch(function () { return {}; }), 8000, {}),
        withTimeout(loadMetadata(wanted).catch(function () { return {}; }), 8000, {})
      ]).then(function (base) {
        var heroes = base[0] || {};
        var meta = base[1] || {};
        for (var k = 0; k < top.length; k++) {
          var entry = top[k];
          var choice = bestById[entry.id];
          if (!choice) continue;
          var item = metaEntry(meta[choice.mid], me, entry.id, heroes);
          if (!item) continue;
          entry.last = {
            mid: item.mid,
            side: item.side,
            hero: item.hero,
            k: item.k,
            d: item.d,
            a: item.a,
            win: item.win
          };
        }
        saveSession(me, ids, out);
        return out;
      });
    });
  }

  function respond() {
    var q = parseHash();
    if (!q || !q.q) { title("idle"); return; }
    if (q.q === "idle") { title("idle"); return; }
    if (busy) { pending = true; return; }
    busy = true;
    pending = false;

    var rid = q.rid || 0;
    var work;
    if (q.q === "profile") {
      work = profile(String(q.me || ""), String(q.id || "")).then(function (data) {
        return { q: "profile", rid: rid, id: String(q.id || ""), m: data.m, e: data.e, mw: data.mw, ew: data.ew, local: data.local, list: data.list };
      });
    } else {
      work = roster(String(q.me || ""), q.players, q.fresh).then(function (list) {
        return { q: "roster", rid: rid, me: String(q.me || ""), list: list };
      });
    }

    work.then(function (payload) {
      payload.t = Date.now();
      title(JSON.stringify(payload));
    }).catch(function (err) {
      title(JSON.stringify({ q: q.q, rid: rid, t: Date.now(), err: String(err) }));
    }).then(function () {
      busy = false;
      if (pending) respond();
    });
  }

  window.addEventListener("hashchange", respond);
  respond();
})();
</script>
</body>
</html>
