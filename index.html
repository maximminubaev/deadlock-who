<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WHO|idle</title>
<style>body{font:12px sans-serif;color:#ddd;background:#111}</style>
</head>
<body>
<script>
(function () {
  "use strict";

  var API = "https://api.deadlock-api.com/v1/players/";
  var MATCH_API = "https://api.deadlock-api.com/v1/matches/";
  var ASSETS = "https://api.deadlock-api.com/v1/assets/heroes";
  var MODES = ["normal", "street_brawl"];
  var STATS_TTL = 2 * 60 * 1000;
  var HIST_TTL = 10 * 60 * 1000;
  var HERO_TTL = 24 * 60 * 60 * 1000;
  var STATS_PREFIX = "who_stats_v3_";
  var HIST_PREFIX = "who_hist_v3_";
  var HERO_KEY = "who_heroes_v1";
  var ROSTER_PREFIX = "who_rosters_v2_";
  var ROSTER_TTL = 24 * 60 * 60 * 1000;
  var ROSTER_MAX = 15;

  var statsCache = null;
  var statsMe = "";
  var busy = false;
  var pending = false;

  function title(s) {
    try { document.title = "WHO|" + s; } catch (e) { }
  }

  function parseHash() {
    try {
      var h = location.hash ? location.hash.slice(1) : "";
      if (!h) return null;
      return JSON.parse(decodeURIComponent(h));
    } catch (e) {
      return null;
    }
  }

  function readJson(key, ttl) {
    try {
      var raw = localStorage.getItem(key);
      if (!raw) return null;
      var obj = JSON.parse(raw);
      if (!obj || typeof obj.at !== "number" || Date.now() - obj.at > ttl) return null;
      return obj.data;
    } catch (e) {
      return null;
    }
  }

  function writeJson(key, data) {
    try { localStorage.setItem(key, JSON.stringify({ at: Date.now(), data: data })); } catch (e) { }
  }

  function loadRosters(me) {
    return readJson(ROSTER_PREFIX + me, ROSTER_TTL) || [];
  }

  function saveRosters(me, list) {
    writeJson(ROSTER_PREFIX + me, list.slice(-ROSTER_MAX));
  }

  function sameSet(a, b) {
    if (!a || !b || a.length !== b.length) return false;
    var sa = a.slice().sort();
    var sb = b.slice().sort();
    for (var i = 0; i < sa.length; i++) {
      if (sa[i] !== sb[i]) return false;
    }
    return true;
  }

  function isSubset(a, b) {
    if (!a || !b) return false;
    for (var i = 0; i < a.length; i++) {
      if (b.indexOf(a[i]) < 0) return false;
    }
    return true;
  }

  function uniqueIds(players) {
    var seen = {};
    var out = [];
    var list = players || [];
    for (var i = 0; i < list.length; i++) {
      var id = String((list[i] && list[i].id) || "");
      if (!id || seen[id]) continue;
      seen[id] = true;
      out.push(id);
    }
    return out;
  }

  function fetchJson(url) {
    return fetch(url, { cache: "no-store" }).then(function (r) {
      if (!r.ok) throw new Error("http " + r.status);
      return r.json();
    });
  }

  function withTimeout(promise, ms, fallback) {
    return Promise.race([
      promise,
      new Promise(function (resolve) {
        setTimeout(function () { resolve(fallback); }, ms);
      })
    ]);
  }

  function loadStats(me, force) {
    if (!force && statsCache && statsMe === me) return Promise.resolve(statsCache);
    if (!force) {
      var cached = readJson(STATS_PREFIX + me, STATS_TTL);
      if (cached) {
        statsCache = cached;
        statsMe = me;
        return Promise.resolve(cached);
      }
    }
    var urls = [];
    for (var i = 0; i < MODES.length; i++) {
      urls.push(API + me + "/mate-stats?game_mode=" + MODES[i]);
      urls.push(API + me + "/enemy-stats?game_mode=" + MODES[i]);
    }
    return Promise.all(urls.map(fetchJson)).then(function (res) {
      var mates = {};
      var enemies = {};
      for (var k = 0; k < MODES.length; k++) {
        var mres = res[k * 2] || [];
        var eres = res[k * 2 + 1] || [];
        for (var a = 0; a < mres.length; a++) {
          var id = String(mres[a].mate_id);
          if (!mates[id]) mates[id] = { m: 0, w: 0, matches: [] };
          mates[id].m += mres[a].matches_played || 0;
          mates[id].w += mres[a].wins || 0;
          var mm = mres[a].matches || [];
          for (var mi = 0; mi < mm.length; mi++) mates[id].matches.push(String(mm[mi]));
        }
        for (var b = 0; b < eres.length; b++) {
          var eid = String(eres[b].enemy_id);
          if (!enemies[eid]) enemies[eid] = { e: 0, w: 0, matches: [] };
          enemies[eid].e += eres[b].matches_played || 0;
          enemies[eid].w += eres[b].wins || 0;
          var em = eres[b].matches || [];
          for (var ei = 0; ei < em.length; ei++) enemies[eid].matches.push(String(em[ei]));
        }
      }
      var data = { mates: mates, enemies: enemies };
      writeJson(STATS_PREFIX + me, data);
      statsCache = data;
      statsMe = me;
      return data;
    });
  }

  function loadHeroes() {
    var cached = readJson(HERO_KEY, HERO_TTL);
    if (cached) return Promise.resolve(cached);
    return fetchJson(ASSETS).then(function (list) {
      var map = {};
      for (var i = 0; i < list.length; i++) {
        map[String(list[i].id)] = String(list[i].name || "");
      }
      writeJson(HERO_KEY, map);
      return map;
    });
  }

  function loadHistory(id, force) {
    if (!force) {
      var cached = readJson(HIST_PREFIX + id, HIST_TTL);
      if (cached) return Promise.resolve(cached);
    }
    return fetchJson(API + id + "/match-history").then(function (list) {
      var map = {};
      for (var i = 0; i < list.length; i++) {
        map[String(list[i].match_id)] = list[i];
      }
      writeJson(HIST_PREFIX + id, map);
      return map;
    });
  }

  function modeName(h) {
    if (!h) return "";
    var gm = Number(h.game_mode);
    var mm = Number(h.match_mode);
    if (gm === 4) return "Street Brawl";
    if (mm === 4) return "Ranked";
    if (mm === 3) return "Coop Bot";
    if (mm === 2) return "Private";
    if (mm === 5) return "Server Test";
    if (mm === 6) return "Tutorial";
    if (mm === 7) return "Hero Labs";
    if (mm === 8) return "New Player";
    if (gm === 1) return "Normal";
    if (gm === 2) return "1v1";
    if (gm === 3) return "Sandbox";
    if (gm === 5) return "Explore";
    return "Other";
  }

  function profile(me, id) {
    return Promise.all([
      loadStats(me),
      withTimeout(loadHeroes().catch(function () { return {}; }), 5000, {}),
      withTimeout(loadHistory(id).catch(function () { return {}; }), 6000, {}),
      withTimeout(loadHistory(me).catch(function () { return {}; }), 6000, {})
    ]).then(function (all) {
      var stats = all[0];
      var heroes = all[1];
      var hist = all[2];
      var myHist = all[3];
      var m = stats.mates[id];
      var e = stats.enemies[id];
      var shared = {};
      var i;
      if (m && m.matches) {
        for (i = 0; i < m.matches.length; i++) shared[m.matches[i]] = "with";
      }
      if (e && e.matches) {
        for (i = 0; i < e.matches.length; i++) {
          if (!shared[e.matches[i]]) shared[e.matches[i]] = "vs";
        }
      }
      var ids = Object.keys(shared);
      ids.sort(function (a, b) { return Number(b) - Number(a); });
      var out = [];
      for (i = 0; i < ids.length && out.length < 3; i++) {
        var mid = ids[i];
        var h = hist[mid];
        var yh = myHist[mid];
        out.push({
          mid: mid,
          hero: h && heroes[String(h.hero_id)] ? heroes[String(h.hero_id)] : "",
          time: h ? Number(h.start_time) || 0 : 0,
          mode: modeName(h),
          side: shared[mid],
          k: h ? Number(h.player_kills) || 0 : -1,
          d: h ? Number(h.player_deaths) || 0 : -1,
          a: h ? Number(h.player_assists) || 0 : -1,
          yk: yh ? Number(yh.player_kills) || 0 : -1,
          yd: yh ? Number(yh.player_deaths) || 0 : -1,
          ya: yh ? Number(yh.player_assists) || 0 : -1,
          win: yh ? Number(yh.match_result) : -1
        });
      }
      var rosters = loadRosters(me);
      var prev = rosters.slice(0, -1);
      var local = 0;
      for (var r = 0; r < prev.length; r++) {
        if (prev[r].ids && prev[r].ids.indexOf(String(id)) >= 0) local += 1;
      }
      return {
        m: m ? m.m : 0,
        e: e ? e.e : 0,
        mw: m ? m.w : 0,
        ew: e ? e.w : 0,
        local: local,
        list: out
      };
    });
  }

  function bestShared(stats, id) {
    var m = stats.mates[id];
    var e = stats.enemies[id];
    var best = 0;
    var side = "";
    function consider(list, kind) {
      if (!list) return;
      for (var i = 0; i < list.length; i++) {
        var mid = Number(list[i]) || 0;
        if (mid > best) {
          best = mid;
          side = kind;
        }
      }
    }
    consider(m && m.matches, "with");
    consider(e && e.matches, "vs");
    if (!best) return null;
    return { mid: String(best), side: side };
  }

  function lastShared(stats, id, hist, myHist, heroes) {
    var best = bestShared(stats, id);
    if (!best) return null;
    var mid = best.mid;
    var side = best.side;
    var h = hist[mid];
    var yh = myHist[mid];
    return {
      mid: mid,
      side: side,
      hero: h && heroes[String(h.hero_id)] ? heroes[String(h.hero_id)] : "",
      k: h ? Number(h.player_kills) || 0 : -1,
      d: h ? Number(h.player_deaths) || 0 : -1,
      a: h ? Number(h.player_assists) || 0 : -1,
      win: yh ? Number(yh.match_result) : -1,
      time: h ? Number(h.start_time) || 0 : 0,
      mode: modeName(h)
    };
  }

  function roster(me, players, fresh) {
    loadHeroes().catch(function () { });
    return loadStats(me, !!fresh).then(function (stats) {
      var out = [];
      var byId = {};
      var list = players || [];
      for (var i = 0; i < list.length; i++) {
        var p = list[i] || {};
        var id = String(p.id || "");
        if (!id || id === String(me)) continue;
        var m = stats.mates[id];
        var e = stats.enemies[id];
        if (!m && !e) continue;
        var entry = {
          id: id,
          n: String(p.n || ""),
          m: m ? m.m : 0,
          mw: m ? m.w : 0,
          e: e ? e.e : 0,
          ew: e ? e.w : 0
        };
        out.push(entry);
        byId[id] = entry;
      }

      var ids = uniqueIds(players);
      if (ids.length >= 8) {
        var rosters = loadRosters(me);
        var last = rosters.length ? rosters[rosters.length - 1] : null;
        var now = Date.now();
        var same = last && sameSet(ids, last.ids);
        var sub = last && isSubset(ids, last.ids);
        var sup = last && isSubset(last.ids, ids);
        var sameMatch = !!(last && (same || sub || (sup && now - last.at < 3 * 60 * 1000)));
        var prev = sameMatch ? rosters.slice(0, -1) : rosters.slice();
        var counts = {};
        for (var r = 0; r < prev.length; r++) {
          var rids = prev[r].ids || [];
          for (var j = 0; j < rids.length; j++) {
            var rid = String(rids[j]);
            if (rid === String(me)) continue;
            if (ids.indexOf(rid) >= 0) counts[rid] = (counts[rid] || 0) + 1;
          }
        }
        for (var cid in counts) {
          var cnt = counts[cid];
          if (byId[cid]) {
            byId[cid].recent = true;
            byId[cid].recentCount = cnt;
          } else {
            var pname = "";
            for (var k = 0; k < list.length; k++) {
              if (String((list[k] && list[k].id) || "") === cid) pname = String(list[k].n || "");
            }
            out.push({
              id: cid,
              n: pname,
              m: cnt,
              mw: -1,
              e: 0,
              ew: 0,
              recent: true,
              recentCount: cnt
            });
          }
        }
        if (sameMatch) {
          for (var u = 0; u < ids.length; u++) {
            if (last.ids.indexOf(ids[u]) < 0) last.ids.push(ids[u]);
          }
          last.at = now;
        } else {
          rosters.push({ at: now, ids: ids });
        }
        saveRosters(me, rosters);
      }

      out.sort(function (x, y) { return (y.m + y.e) - (x.m + x.e); });

      var top = out.slice(0, 6);
      if (!top.length) return out;
      return Promise.all([
        withTimeout(loadHistory(me, !!fresh).catch(function () { return {}; }), 8000, {}),
        withTimeout(loadHeroes().catch(function () { return {}; }), 8000, {})
      ]).then(function (base) {
        var myHist = base[0] || {};
        var heroes = base[1] || {};
        return Promise.all(top.map(function (entry) {
          var best = bestShared(stats, entry.id);
          if (!best) return null;
          return withTimeout(loadHistory(entry.id).catch(function () { return {}; }), 8000, {})
            .then(function (hist) {
              if (hist[best.mid]) return hist;
              return loadHistory(entry.id, true).catch(function () { return hist || {}; });
            })
            .then(function (hist) {
              var last = lastShared(stats, entry.id, hist || {}, myHist, heroes);
              if (last) entry.last = last;
            });
        })).then(function () { return out; });
      });
    });
  }

  function respond() {
    var q = parseHash();
    if (!q || !q.q) { title("idle"); return; }
    if (busy) { pending = true; return; }
    busy = true;
    pending = false;

    var rid = q.rid || 0;
    var work;
    if (q.q === "profile") {
      work = profile(String(q.me || ""), String(q.id || "")).then(function (data) {
        return { q: "profile", rid: rid, id: String(q.id || ""), m: data.m, e: data.e, mw: data.mw, ew: data.ew, local: data.local, list: data.list };
      });
    } else {
      work = roster(String(q.me || ""), q.players, q.fresh).then(function (list) {
        return { q: "roster", rid: rid, me: String(q.me || ""), list: list };
      });
    }

    work.then(function (payload) {
      payload.t = Date.now();
      title(JSON.stringify(payload));
    }).catch(function (err) {
      title(JSON.stringify({ q: q.q, rid: rid, t: Date.now(), err: String(err) }));
    }).then(function () {
      busy = false;
      if (pending) respond();
    });
  }

  window.addEventListener("hashchange", respond);
  respond();
})();
</script>
</body>
</html>
